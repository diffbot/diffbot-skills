name: Release

# diffbot-skills is not an npm or PyPI package. Pushing a version tag creates
# the GitHub Release for that tag. There is no registry token and no GitHub
# environment. github.token is the workflow's built-in token, not a stored secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight release. A re-push of the same tag queues.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          for f in \
            .claude-plugin/plugin.json \
            .cortex-plugin/plugin.json \
            .factory-plugin/plugin.json \
            .grok-plugin/plugin.json \
            .github/plugin/plugin.json
          do
            version=$(node -p "require('./${f}').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::${f} version ${version} does not match tag v${tag}."
              exit 1
            fi
            echo "${f} ${version}"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it."
          else
            gh release create "$tag" \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
