# Secret-free directory allowlist guard.
# Diffbot is not a Verified Anthropic org. Runs on pull requests into main
# and pushes to main only. No schedule, no pull_request_target, no secrets,
# no live API tests, and no Claude CLI install.

name: directory-policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  directory-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check directory allowlist policy
        run: python3 scripts/check-directory-policy.py

      - name: claude plugin validate --strict
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
            claude plugin validate .claude-plugin/plugin.json --strict
          else
            echo "claude CLI is not installed on this runner; skipping plugin validate"
          fi
